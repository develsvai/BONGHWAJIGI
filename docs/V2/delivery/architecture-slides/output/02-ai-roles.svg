<text x="72" y="628.85" font-family="Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="400" fill="#172E2A" text-anchor="start">DB가 유사한 근거와 출처를 검색</text>
<text x="72" y="672" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="400" fill="#61736F" text-anchor="start">인터넷 뉴스는 별도 검색으로 보강</text>
<text x="566" y="552.9" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#146C76" text-anchor="start">입력  검색된 근거와 원문</text>
<text x="566" y="594.85" font-family="Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="400" fill="#172E2A" text-anchor="start">출력  사건 요약과 인용 출처</text>
<text x="566" y="628.85" font-family="Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="400" fill="#172E2A" text-anchor="start">참고 설명으로 보관</text>
<text x="566" y="672" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="400" fill="#61736F" text-anchor="start">개인 단계·행동을 직접 생성하지 않음</text>
<text x="1080" y="552.9" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#71817D" text-anchor="start">입력  정형 관측과 위치 자료</text>
<text x="1080" y="594.85" font-family="Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="400" fill="#172E2A" text-anchor="start">출력 후보  접근 시간·기간별 확률</text>
<text x="1080" y="628.85" font-family="Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="400" fill="#172E2A" text-anchor="start">현재 앱 제공값은 예측 불가</text>
<text x="1080" y="672" font-family="Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="400" fill="#61736F" text-anchor="start">국내 검증과 보정 후 연결할 후보</text>
