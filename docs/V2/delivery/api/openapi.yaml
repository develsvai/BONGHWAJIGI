components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 계정에 결합된 access token. issuer/audience/발급·갱신 계약은 E1 확정 필요. 토큰을 URL에 넣지 않는다.
  schemas:
    Meta:
      type: object
      properties:
        schema_version:
          const: 0.1.0
        mode:
          type: string
          enum:
          - live
          - simulation
        request_id: *id002
        generated_at: &id009
          type: string
          description: ''
          format: date-time
        data_status:
          type: string
          enum:
          - current
          - partial
          - stale
          - unavailable
      required:
      - schema_version
      - mode
      - request_id
      - generated_at
      - data_status
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: ''
          format: uri
        title:
          type: string
          description: ''
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: ''
        instance:
          type: string
          description: ''
        code:
          type: string
          description: ''
        request_id: *id002
        retryable: &id010
          type: boolean
        field_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: ''
              reason:
                type: string
                description: ''
            required:
            - field
            - reason
            additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - request_id
      - retryable
      - field_errors
      additionalProperties: false
    Source:
      type: object
      properties:
        id: *id002
        kind:
          type: string
          enum:
          - official
          - observation
          - news
          - simulation
        agency:
          type: string
          description: ''
        url:
          type: string
          description: ''
          format: uri
        published_at: *id009
        observed_at:
          anyOf:
          - *id009
          - type: 'null'
        collected_at: *id009
        valid_until:
          anyOf:
          - *id009
          - type: 'null'
        document_revision:
          type: string
          description: ''
        independent_origin_id: *id002
      required:
      - id
      - kind
      - agency
      - url
      - published_at
      - observed_at
      - collected_at
      - valid_until
      - document_revision
      - independent_origin_id
      additionalProperties: false
    Position:
      type: array
      prefixItems:
      - type: number
        minimum: -180
        maximum: 180
      - type: number
        minimum: -90
        maximum: 90
      items: false
      minItems: 2
      maxItems: 2
      description: WGS84 [경도, 위도]. 위경도 순서를 뒤집지 않는다.
    Position3D:
      type: array
      prefixItems:
      - type: number
        minimum: -180
        maximum: 180
      - type: number
        minimum: -90
        maximum: 90
      - type: number
      items: false
      minItems: 3
      maxItems: 3
      description: '[경도, 위도, WGS84 타원체고(m)]. 다른 고도 기준은 변환 확인 후 사용.'
    Polygon:
      type: object
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Position'
            minItems: 4
          minItems: 1
      required:
      - type
      - coordinates
      additionalProperties: false
    MultiPolygon:
      type: object
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/Position'
              minItems: 4
            minItems: 1
          minItems: 1
      required:
      - type
      - coordinates
      additionalProperties: false
    AreaGeometry:
      oneOf:
      - $ref: '#/components/schemas/Polygon'
      - $ref: '#/components/schemas/MultiPolygon'
    ProfileInput:
      type: object
      properties:
        mobility: &id012
          type: string
          enum:
          - independent
          - walking_aid
          - wheelchair
          - assistance_required
          - unknown
        stairs: &id013
          type: string
          enum:
          - able
          - difficult
          - unable
          - unknown
        communication_preference:
          type: string
          enum:
          - text
          - voice
          - both
        sensory_supports:
          type: array
          items:
            type: string
            enum:
            - vision
            - hearing
          uniqueItems: true
        dependents:
          type: array
          items:
            type: string
            enum:
            - child
            - care_recipient
            - pet
          uniqueItems: true
      required: []
      additionalProperties: false
