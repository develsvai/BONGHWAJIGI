openapi: 3.1.0
info:
  title: 봉화지기 앱 연동 API
  version: 0.1.0-draft
  description: V2 및 최신 5개 화면 기준의 앱팀 연동 초안. 미배포. 모든 예제는 simulation이며 실제 재난 안내가 아니다. authentication issuer와 운영 URL은
    미정이다.
servers:
- url: https://api.example.invalid
  description: 자리표시자. 실제 접속 서버가 아니다.
security:
- BearerAuth: []
tags:
- name: 공통
- name: 프로필
- name: 위치
- name: 홈
- name: 경보
- name: 대응
- name: 기본수칙
- name: 조건부기능
