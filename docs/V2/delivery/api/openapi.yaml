      properties:
        installation_id: *id002
        registered_at: *id009
        push_status:
          type: string
          enum:
          - registered
          - disabled
        notification_permission:
          type: string
          enum:
          - granted
          - denied
          - not_determined
      required:
      - installation_id
      - registered_at
      - push_status
      - notification_permission
      additionalProperties: false
    Feature:
      type: object
      properties:
        enabled: *id010
        reason_code:
          anyOf:
          - type: string
            description: ''
          - type: 'null'
