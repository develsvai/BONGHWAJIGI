                    impact_prediction:
                      enabled: false
                      reason_code: NOT_ADOPTED
                    route_3d:
                      enabled: false
                      reason_code: NOT_ADOPTED
                    voice_turns:
                      enabled: false
                      reason_code: NOT_ADOPTED
                    guidance_tts:
                      enabled: false
                      reason_code: NOT_ADOPTED
                    support_draft:
                      enabled: true
                      reason_code: null
                  location_max_age_seconds: 300
                  location_max_accuracy_m: 100
