      required:
      - revision
      - updated_at
      - preferences
      additionalProperties: false
    PreferencesWrite:
      type: object
      properties:
        base_revision: *id001
        preferences:
          $ref: '#/components/schemas/PreferencesInput'
      required:
      - base_revision
      - preferences
      additionalProperties: false
    LocationWrite:
      type: object
      properties:
        fix_id: *id002
        installation_id: *id002
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
          maximum: 100000
        captured_at: *id009
      required:
      - fix_id
      - installation_id
      - latitude
      - longitude
      - accuracy_m
      - captured_at
      additionalProperties: false
    Location:
      type: object
      properties:
        revision: *id001
        status:
          type: string
          enum:
          - available
          - stale
          - inaccurate
          - unavailable
        fix:
          anyOf:
          - $ref: '#/components/schemas/LocationWrite'
          - type: 'null'
        valid_until:
          anyOf:
          - *id009
          - type: 'null'
        reason_codes:
          type: array
          items:
            type: string
            description: ''
      required:
      - revision
      - status
      - fix
      - valid_until
      - reason_codes
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              const: unavailable
        then:
          properties:
            fix:
              type: 'null'
            valid_until:
              type: 'null'
      - if:
          properties:
            status:
              const: available
        then:
          properties:
            fix:
              $ref: '#/components/schemas/LocationWrite'
            valid_until: *id009
    DeviceWrite:
      type: object
      properties:
        platform:
          type: string
          enum:
          - android
          - ios
          - web
        push_provider:
          type: string
          enum:
          - fcm
          - apns
        push_token:
          anyOf:
          - type: string
            description: ''
            minLength: 1
            maxLength: 4096
          - type: 'null'
        notification_permission:
          type: string
          enum:
          - granted
          - denied
          - not_determined
        app_version:
          type: string
          description: ''
          minLength: 1
          maxLength: 64
      required:
      - platform
      - push_provider
      - push_token
      - notification_permission
      - app_version
      additionalProperties: false
    Device:
