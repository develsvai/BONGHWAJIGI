name: bonghwajigi-analysis-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bonghwajigi_analysis
      POSTGRES_USER: bonghwajigi
      POSTGRES_PASSWORD: local-analysis-only
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["analysis-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonghwajigi -d bonghwajigi_analysis"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["analysis-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  analysis-postgres:
  analysis-redis:
