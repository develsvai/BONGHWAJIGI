name: scaffold-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bonghwajigi_analysis
          POSTGRES_USER: bonghwajigi
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bonghwajigi -d bonghwajigi_analysis"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.10"
          python-version: "3.12"
      - run: uv sync --frozen --extra server --extra collector --group api-contract
      - run: uv run --no-sync ruff check src tests migrations tools/gpu_client.py tools/run_analysis_demo.py tools/serve_analysis.py
      - run: uv run --no-sync ruff format --check src tests migrations tools/gpu_client.py tools/run_analysis_demo.py tools/serve_analysis.py
      - run: uv run --no-sync alembic upgrade head
        env:
          BONGHWA_DATABASE_URL: postgresql+psycopg://bonghwajigi:ci-only@127.0.0.1:5432/bonghwajigi_analysis
      - run: uv run --no-sync pytest
        env:
          BONGHWA_TEST_DATABASE_URL: postgresql+psycopg://bonghwajigi:ci-only@127.0.0.1:5432/bonghwajigi_analysis
      - run: uv run --no-sync python tools/validate_app_api.py
      - run: docker compose --env-file .env.example -f deploy/compose/general.yaml config --quiet
