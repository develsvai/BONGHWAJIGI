name: scaffold-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.10"
          python-version: "3.12"
      - run: uv sync --frozen --extra server --extra collector --group api-contract
      - run: uv run --no-sync ruff check src tests migrations tools/gpu_client.py
      - run: uv run --no-sync ruff format --check src tests migrations tools/gpu_client.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python tools/validate_app_api.py
      - run: docker compose --env-file .env.example -f deploy/compose/general.yaml config --quiet
